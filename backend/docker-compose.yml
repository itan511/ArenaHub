version: "3.9"

services:
  backend:
    build: .
    container_name: backend
    command: >
      sh -c "
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
